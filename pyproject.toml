[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbss"
version = "0.1.0"
description = "Database Schema Synchronizer: current-state SQL definitions generated from Supabase/PostgreSQL migrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dbss = "dbss.cli.app:main"

[tool.setuptools.packages.find]
include = ["dbss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: integration tests that need Docker and the configured supabase/postgres image",
]

[tool.setuptools.package-data]
"dbss.database.bootstrap" = ["*.sql"]
